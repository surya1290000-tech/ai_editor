# ─── Edit Budget ──────────────────────────────────────────────────────────────
#
# Controls how many major editing interventions Agent 2 (Story Editor) is
# allowed to make per project. Prevents effect density overload.
#
# NO_EDIT is a first-class valid decision.
# Selective, professional editing — not maximum effect density.
# ──────────────────────────────────────────────────────────────────────────────

edit_budget:

  # ── Hard Limits per Project ─────────────────────────────────────────────
  hero_text_max: 2              # Full-screen title cards
  editorial_card_max: 1         # Lower-third info cards
  strong_punch_in_max: 3        # 1.3x+ zoom jump cuts
  medium_punch_in_max: 5        # 1.15x-1.3x zoom
  subtle_punch_in_max: 8        # 1.05x-1.15x zoom
  sfx_max: 6                    # Sound effect cues
  broll_max: 3                  # B-roll overlay clips
  emphasis_text_max: 8          # Keyword highlight pops in captions

  # ── Minimum Spacing (seconds) ──────────────────────────────────────────
  # Prevents clustering of effects within short time windows
  min_seconds_between_punch_ins: 4.0
  min_seconds_between_sfx: 3.0
  min_seconds_between_hero_text: 15.0
  min_seconds_between_broll: 8.0
  min_seconds_between_emphasis_text: 2.0

  # ── Density Control ────────────────────────────────────────────────────
  max_edit_density_per_10s: 3   # Max major interventions in any 10s window

  # ── Philosophy ─────────────────────────────────────────────────────────
  no_edit_is_valid: true         # NO_EDIT is an explicit, valid editorial choice
  prefer_restraint: true         # When uncertain, prefer NO_EDIT over applying an effect


# ─── Pacing Presets ───────────────────────────────────────────────────────────
# Agent 2 selects a pacing preset that adjusts thresholds for cut decisions.

pacing_presets:

  fast:
    cut_confidence_threshold: 0.65
    punch_confidence_threshold: 0.70
    dead_space_trim_aggressive: true
    description: "Aggressive pacing — removes most dead space, frequent cuts"

  balanced:
    cut_confidence_threshold: 0.78
    punch_confidence_threshold: 0.80
    dead_space_trim_aggressive: false
    description: "Balanced pacing — preserves rhetorical holds, natural rhythm"

  relaxed:
    cut_confidence_threshold: 0.88
    punch_confidence_threshold: 0.85
    dead_space_trim_aggressive: false
    description: "Relaxed pacing — minimal cuts, preserves speaker's natural timing"
